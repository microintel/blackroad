    if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);

<!-- ============ STATEMENT (the full income/expense ledger) ============ -->
<main id="ledger">
  <div class="ledger-toolbar">
    <div class="ledger-head">
      <h2>Statement</h2>
      <div class="ledger-head-actions">
        <div class="date-filter update-date-field" id="updateDateField" title="Income & Expenditure — updated last date">
          <i class="bi bi-clock-history"></i>
          <span class="update-date-label">Updated</span>
          <input type="date" id="updateDateInput" aria-label="Income &amp; Expenditure updated last date">
        </div>
        <button class="add-income-btn top-add-income-btn" id="addIncomeBtn" type="button"><i class="bi bi-plus-lg"></i> Add income</button>
      </div>
    </div>

    <!-- ---- Date range filter + collapse-all (large-ledger controls) ---- -->
    <div class="filter-row">
      <div class="date-filter">
        <i class="bi bi-calendar-event"></i>
        <input type="date" id="dateFrom" title="From date" aria-label="From date">
        <span class="date-sep">–</span>
        <input type="date" id="dateTo" title="To date" aria-label="To date">
        <button class="date-filter-clear" id="dateFilterClear" type="button" title="Clear date filter" style="display:none;"><i class="bi bi-x-lg"></i></button>
      </div>
      <button class="ghost-btn" id="collapseAllBtn" type="button"><i class="bi bi-arrows-collapse"></i> Collapse all</button>
      <a class="ghost-btn" href="search.html"><i class="bi bi-search"></i> Search</a>
      <a class="ghost-btn" href="jumpto.html"><i class="bi bi-calendar3"></i> Jump to</a>
    </div>

    <div class="search-status" id="searchStatus" style="display:none;"></div>
  </div>

  <div id="ledgerBody"><!-- rendered by statement.js --></div>
</main>

<!-- ============ ADD INCOME DIALOG ============ -->
<dialog id="incomeDialog">
  <form class="dialog-inner" id="incomeForm">
    <h3 id="incomeDialogTitle"><i class="bi bi-arrow-down-left"></i> Add income</h3>
    <div class="field">
      <label for="incAmount">Amount</label>
      <input type="number" id="incAmount" step="0.01" min="0" required>
    </div>
    <div class="field">
      <label for="incFrom">Source</label>
      <input type="text" id="incFrom" placeholder="e.g. Salary, Dad, Freelance" required>
    </div>
    <div class="field">
      <label for="incDate">Date</label>
      <input type="date" id="incDate" required>
    </div>
    <div class="dialog-actions">
      <button type="button" class="btn" data-close="incomeDialog">Cancel</button>
      <button type="submit" class="btn primary">Save</button>
    </div>
  </form>
</dialog>

<!-- ============ ADD/EDIT TRANSACTION DIALOG ============ -->
<dialog id="txnDialog">
  <form class="dialog-inner" id="txnForm">
    <h3 id="txnDialogTitle"><i class="bi bi-arrow-up-right"></i> Add expense</h3>
    <div class="field">
      <label for="txnAmount">Amount</label>
      <input type="number" id="txnAmount" step="0.01" min="0" required>
    </div>
    <div class="field">
      <label for="txnDesc">Description</label>
      <input type="text" id="txnDesc" placeholder="e.g. Groceries" required>
    </div>
    <div class="field">
      <label for="txnCategorySelect">Category</label>
      <select id="txnCategorySelect">
        <option value="">Select a category…</option>
      </select>
      <input type="text" id="txnCategory" placeholder="Type a category name" style="display:none; margin-top:8px;">
    </div>
    <div class="field">
      <label for="txnDate">Date</label>
      <input type="date" id="txnDate" required>
    </div>
    <div class="dialog-actions">
      <button type="button" class="btn" data-close="txnDialog">Cancel</button>
      <button type="submit" class="btn primary">Save</button>
    </div>
  </form>
</dialog>

<!-- ============ CONFIRM DELETE DIALOG ============ -->
<dialog id="confirmDialog">
  <div class="dialog-inner">
    <h3 id="confirmTitle"><i class="bi bi-exclamation-triangle"></i> Delete this?</h3>
    <p id="confirmBody" style="color:var(--text-dim); font-size:0.86rem; margin-top:-8px;"></p>
    <div class="dialog-actions">
      <button type="button" class="btn" data-close="confirmDialog">Cancel</button>
      <button type="button" class="btn danger-solid" id="confirmYesBtn"><i class="bi bi-trash3"></i> Delete</button>
    </div>
  </div>
</dialog>

<div id="toast"></div>

<script src="shared.js"></script>
<script src="statement.js"></script>
</body>
</html>
