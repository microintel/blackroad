<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BlackRoad — Search</title>
<script>
  (function(){ try{
    var t = localStorage.getItem('br-theme');
    if (t && t !== 'soft') document.documentElement.setAttribute('data-theme', t);
  }catch(e){} })();
</script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
<style>
  /* kill the default browser focus ring everywhere on this page and
     replace it with a soft shadow so nothing shows a blue outline */
  #searchInput, .chip, .search-toolbar button, .filter-actions button,
  input[type="date"] { outline: none; }
  #searchInput {
    border: none;
    background: transparent;
    box-shadow: none;
    -webkit-appearance: none;
    appearance: none;
  }
  #searchInput:focus, .chip:focus-visible, .search-toolbar button:focus-visible,
  .filter-actions button:focus-visible, input[type="date"]:focus {
    outline: none;
    box-shadow: none;
  }

  .filter-panel{
    margin:14px 0;padding:18px;border-radius:18px;display:none;
    background:rgba(127,127,127,.08);
  }
  .filter-panel.open{display:block;}
  .filter-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
  .filter-col label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;opacity:.6;margin-bottom:8px;letter-spacing:.03em;}
  .chip-group{display:flex;flex-wrap:wrap;gap:8px;max-height:150px;overflow-y:auto;padding:2px;}
  .chip-empty{font-size:12px;opacity:.5;}
  .chip{
    padding:8px 14px;border-radius:999px;border:none;
    background:rgba(127,127,127,.14);color:inherit;font-size:13px;cursor:pointer;line-height:1;
    transition:background .15s ease;
  }
  .chip.active{background:var(--accent,#1a1a1a);color:#fff;}
  .filter-dates{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px;}
  .filter-dates label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;opacity:.6;margin-bottom:8px;letter-spacing:.03em;}
  .filter-dates input[type="date"]{width:100%;padding:11px 12px;border-radius:12px;border:none;background:rgba(127,127,127,.14);color:inherit;}
  .filter-actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;}
  .filter-actions button{
    padding:11px 18px;border-radius:12px;border:none;
    background:rgba(127,127,127,.14);color:inherit;cursor:pointer;font-size:13px;font-weight:600;
  }
  .filter-actions button.primary{background:var(--accent,#1a1a1a);color:#fff;}

  .search-toolbar{display:flex;gap:10px;align-items:center;margin-top:12px;flex-wrap:wrap;}
  .search-toolbar button{
    padding:9px 16px;border-radius:12px;border:none;
    background:rgba(127,127,127,.1);color:inherit;cursor:pointer;font-size:13px;font-weight:600;
    display:flex;align-items:center;gap:6px;
  }
  .search-toolbar button#downloadPdfBtn{background:var(--accent,#1a1a1a);color:#fff;}

  .search-summary{
    display:none;margin:14px 0;padding:16px 4px;gap:10px;
    overflow-x:auto;-webkit-overflow-scrolling:touch;
  }
  .search-summary.show{display:flex;}
  .search-summary .sm-item{
    display:flex;flex-direction:column;gap:4px;flex:0 0 auto;
    padding:12px 18px;border-radius:14px;background:rgba(127,127,127,.08);min-width:104px;
  }
  .search-summary .sm-label{font-size:10px;text-transform:uppercase;opacity:.55;letter-spacing:.03em;}
  .search-summary .sm-val{font-size:17px;font-weight:700;}

  @media (max-width: 640px){
    .filter-grid, .filter-dates{grid-template-columns:1fr;}
    .filter-panel{padding:16px;border-radius:16px;}
    .search-toolbar button{flex:1 1 auto;justify-content:center;}
  }
</style>
</head>
<body data-page="search">

<!-- ============ SEARCH PAGE ============ -->
<div class="page-shell">
  <div class="page-header">
    <span class="page-header-ico"><i class="bi bi-search"></i></span>
    <div>
      <h2>Search</h2>
      <p>Find an entry by source, description, or category.</p>
    </div>
  </div>

  <div class="search-row">
    <span class="search-icon"><i class="bi bi-search"></i></span>
    <input type="text" id="searchInput" placeholder="Search by source, description, or category…" autocomplete="off" autofocus>
    <button class="search-clear" id="searchClear" type="button" title="Clear search" style="display:none;"><i class="bi bi-x-lg"></i></button>
  </div>

  <div class="search-toolbar">
    <button type="button" id="filterToggle"><i class="bi bi-funnel"></i> Filters</button>
    <button type="button" id="downloadPdfBtn" style="display:none;"><i class="bi bi-file-earmark-pdf"></i> Download PDF</button>
  </div>

  <div class="filter-panel" id="filterPanel">
    <div class="filter-grid">
      <div class="filter-col">
        <label>Source (select one or more)</label>
        <div class="chip-group" id="filterSource"></div>
      </div>
      <div class="filter-col">
        <label>Category (select one or more)</label>
        <div class="chip-group" id="filterCategory"></div>
      </div>
    </div>
    <div class="filter-dates">
      <div>
        <label>From</label>
        <input type="date" id="filterFrom">
      </div>
      <div>
        <label>To</label>
        <input type="date" id="filterTo">
      </div>
    </div>
    <div class="filter-actions">
      <button type="button" class="primary" id="filterApply">Apply filters</button>
      <button type="button" id="filterClear">Clear filters</button>
    </div>
  </div>

  <div class="search-summary" id="searchSummary"></div>

  <div class="search-status" id="searchStatus" style="display:none;"></div>

  <div id="searchResults"></div>
</div>

<div id="toast"></div>
