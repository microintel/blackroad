<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BlackRoad — Search</title>
<script>
  (function(){ try{
    var t = localStorage.getItem('br-theme');
    if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
  }catch(e){} })();
</script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>
  /* kill the default browser focus ring everywhere on this page and
     replace it with a soft shadow so nothing shows a blue outline */
  #searchInput, .chip, .qchip, .seg-btn, .search-toolbar button,
  .sheet-actions button, input[type="date"], input[type="number"],
  .preset-chip { outline: none; }
  #searchInput {
    border: none;
    background: transparent;
    box-shadow: none;
    -webkit-appearance: none;
    appearance: none;
  }
  #searchInput:focus, input:focus { outline: none; box-shadow: none; }

  /* ===== Search bar ===== */
  .search-row{ position:relative; }

  /* ===== Quick filter chips — fast taps without opening the sheet ===== */
  .qchip-row{
    display:flex;
    gap:8px;
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
    padding:12px 2px 4px;
    scrollbar-width:none;
  }
  .qchip-row::-webkit-scrollbar{ display:none; }
  .qchip{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    gap:5px;
    padding:8px 14px;
    border-radius:var(--radius-pill);
    border:1px solid var(--line-soft);
    background:var(--card);
    color:var(--text-dim);
    font-size:0.78rem;
    font-weight:600;
    cursor:pointer;
    white-space:nowrap;
    transition:0.12s;
  }
  .qchip i{ font-size:0.72rem; }
  .qchip.active{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .qchip.more{ color:var(--text); }

  /* ===== Toolbar (filter button badge, sort, export) ===== */
  .search-toolbar{ display:flex; gap:8px; align-items:center; margin-top:10px; flex-wrap:wrap; }
  .search-toolbar .tb-btn{
    display:flex; align-items:center; gap:6px;
    padding:9px 14px; border-radius:var(--radius-pill);
    border:1px solid var(--line-soft); background:var(--card);
    color:var(--text); font-size:0.79rem; font-weight:600; cursor:pointer;
  }
  .search-toolbar .tb-btn .badge-count{
    background:var(--accent); color:#fff; border-radius:999px;
    font-size:0.65rem; padding:1px 6px; font-weight:700;
  }
  .search-toolbar .tb-spacer{ flex:1; }
  .sort-select-wrap{ position:relative; }
  #sortSelect{
    appearance:none; -webkit-appearance:none;
    padding:9px 30px 9px 14px; border-radius:var(--radius-pill);
    border:1px solid var(--line-soft); background:var(--card);
    color:var(--text); font-size:0.79rem; font-weight:600; cursor:pointer;
  }
  .sort-select-wrap i{
    position:absolute; right:11px; top:50%; transform:translateY(-50%);
    pointer-events:none; font-size:0.65rem; color:var(--text-faint);
  }
  #exportMenuBtn{ margin-left:auto; }

  /* ===== Export dropdown ===== */
  .export-menu{
    position:absolute; right:0; top:calc(100% + 6px);
    background:var(--card); border:1px solid var(--line-soft);
    border-radius:var(--radius-md); box-shadow:var(--shadow-pop);
    width:max-content; min-width:180px; max-width:calc(100vw - 24px);
    padding:6px; z-index:80; display:none;
  }
  .export-menu.open{ display:block; }
  .export-menu button{
    width:100%; text-align:left; display:flex; align-items:center; gap:9px;
    padding:10px 12px; border-radius:9px; border:none; background:transparent;
    color:var(--text); font-size:0.83rem; cursor:pointer;
  }
  .export-menu button:active{ background:var(--card-2); }
  .export-wrap{ position:relative; }

  /* ===== Filter sheet: bottom sheet on mobile, centered modal on desktop ===== */
  .sheet-backdrop{
    position:fixed; inset:0; background:rgba(0,0,0,0.45);
    opacity:0; pointer-events:none; transition:opacity 0.2s;
    z-index:200;
  }
  .sheet-backdrop.open{ opacity:1; pointer-events:auto; }

  .filter-sheet{
    position:fixed; left:0; right:0; bottom:0;
    max-height:88vh;
    background:var(--card);
    border-radius:22px 22px 0 0;
    box-shadow:var(--shadow-pop);
    transform:translateY(100%);
    transition:transform 0.28s cubic-bezier(.32,.72,0,1);
    z-index:201;
    display:flex; flex-direction:column;
  }
  .filter-sheet.open{ transform:translateY(0); }
  .sheet-handle{ width:36px; height:4px; border-radius:99px; background:var(--line); margin:10px auto 2px; flex-shrink:0; }
  .sheet-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 18px 4px; flex-shrink:0;
  }
  .sheet-head h3{ margin:0; font-size:1.02rem; }
  .sheet-close{
    width:30px; height:30px; border-radius:50%; border:none;
    background:var(--card-2); color:var(--text-dim); display:flex;
    align-items:center; justify-content:center; cursor:pointer;
  }
  .sheet-body{ overflow-y:auto; padding:14px 18px 4px; -webkit-overflow-scrolling:touch; }
  .sheet-section{ margin-bottom:20px; }
  .sheet-section-label{
    font-size:0.68rem; font-weight:700; text-transform:uppercase;
    letter-spacing:0.05em; color:var(--text-faint); margin-bottom:9px;
  }
  .chip-group{ display:flex; flex-wrap:wrap; gap:8px; max-height:150px; overflow-y:auto; padding:2px; }
  .chip-empty{ font-size:0.78rem; color:var(--text-faint); }
  .chip{
    padding:8px 14px; border-radius:999px; border:1px solid var(--line-soft);
    background:var(--card-2); color:var(--text); font-size:0.79rem; cursor:pointer;
    line-height:1; transition:0.12s;
  }
  .chip.active{ background:var(--accent); border-color:var(--accent); color:#fff; }

  .filter-dates{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .filter-dates label{ display:block; font-size:0.68rem; font-weight:700; text-transform:uppercase; color:var(--text-faint); margin-bottom:7px; letter-spacing:.03em; }
  .filter-dates input[type="date"]{ width:100%; padding:10px 12px; border-radius:var(--radius-sm); border:1px solid var(--line-soft); background:var(--card-2); color:var(--text); }

  .preset-row{ display:flex; gap:8px; align-items:center; margin-bottom:10px; }
  .preset-row input{
    flex:1; padding:10px 12px; border-radius:var(--radius-sm); border:1px solid var(--line-soft);
    background:var(--card-2); color:var(--text); font-size:0.83rem;
  }
  .preset-row button{
    padding:10px 14px; border-radius:var(--radius-sm); border:none;
    background:var(--accent); color:#fff; font-weight:600; font-size:0.79rem; cursor:pointer; flex-shrink:0;
  }
  .preset-chips{ display:flex; flex-wrap:wrap; gap:8px; }
  .preset-chip{
    display:flex; align-items:center; gap:7px; padding:7px 8px 7px 13px;
    border-radius:var(--radius-pill); border:1px solid var(--line-soft);
    background:var(--card-2); color:var(--text); font-size:0.78rem; cursor:pointer;
  }
  .preset-chip .px-del{
    width:18px; height:18px; border-radius:50%; background:var(--line);
    display:flex; align-items:center; justify-content:center; font-size:0.55rem; color:var(--text-dim);
  }
  .preset-chip .px-del:hover{ background:var(--ink-out-bg); color:var(--ink-out); }
  .preset-empty{ font-size:0.78rem; color:var(--text-faint); }

  .sheet-footer{
    display:flex; gap:10px; padding:12px 18px calc(14px + env(safe-area-inset-bottom));
    border-top:1px solid var(--line-soft); flex-shrink:0;
  }
  .sheet-footer button{
    flex:1; padding:13px; border-radius:var(--radius-sm); border:none;
    font-size:0.86rem; font-weight:700; cursor:pointer;
  }
  .sheet-footer .btn-clear{ background:var(--card-2); color:var(--text-dim); }
  .sheet-footer .btn-apply{ background:var(--accent); color:#fff; }

  @media (min-width: 700px){
    .filter-sheet{
      left:50%; right:auto; bottom:auto; top:50%;
      transform:translate(-50%,-46%); opacity:0;
      width:min(560px, 92vw); max-height:80vh;
      border-radius:22px; transition:transform 0.22s ease, opacity 0.22s ease;
      pointer-events:none;
    }
    .filter-sheet.open{ transform:translate(-50%,-50%); opacity:1; pointer-events:auto; }
    .sheet-handle{ display:none; }
    .filter-grid-2col{ display:grid; grid-template-columns:1fr 1fr; gap:18px; }
  }

  .search-summary{
    display:none; margin:14px 0; padding:2px 4px; gap:10px;
    overflow-x:auto; -webkit-overflow-scrolling:touch;
  }
  .search-summary.show{ display:flex; }
  .search-summary .sm-item{
    display:flex; flex-direction:column; gap:4px; flex:0 0 auto;
    padding:12px 18px; border-radius:14px; background:var(--card); border:1px solid var(--line-soft);
    min-width:104px;
  }
  .search-summary .sm-label{ font-size:10px; text-transform:uppercase; color:var(--text-faint); letter-spacing:.03em; }
  .search-summary .sm-val{ font-size:17px; font-weight:700; color:var(--text); }

  /* ===== Flat result rows — native list feel, tappable ===== */
  .result-list{ background:var(--card); border-radius:var(--radius-lg); overflow:hidden; box-shadow:var(--shadow-card); }
  .result-row{
    display:flex; align-items:center; gap:11px; padding:12px 14px;
    border-bottom:1px solid var(--line-soft); cursor:pointer; transition:background 0.1s;
    min-width:0;
  }
  .result-row:last-child{ border-bottom:none; }
  .result-row:active{ background:var(--card-2); }
  .result-ico{
    width:32px; height:32px; border-radius:10px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-size:0.8rem;
  }
  .result-ico.income{ background:var(--ink-in-bg); color:var(--ink-in); }
  .result-ico.expense{ background:var(--ink-out-bg); color:var(--ink-out); }
  .result-main{ flex:1; min-width:0; }
  .result-desc{ font-size:0.86rem; color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .result-meta{ margin-top:2px; font-size:0.68rem; color:var(--text-faint); text-transform:uppercase; letter-spacing:.03em; display:flex; align-items:center; gap:5px; }
  .result-side{ display:flex; flex-direction:column; align-items:flex-end; flex-shrink:0; }
  .result-amt{ font-family:var(--font-mono); font-weight:700; font-size:0.85rem; }
  .result-amt.income{ color:var(--ink-in); }
  .result-amt.expense{ color:var(--ink-out); }
  .result-date{ font-family:var(--font-mono); font-size:0.66rem; color:var(--text-faint); margin-top:2px; }

  @media (max-width: 640px){
    .filter-dates{ grid-template-columns:1fr; }
  }

  /* ===== Export progress dialog (SweetAlert2) — same animation
     language as the main dashboard's backup progress, retimed to
     this page's palette. ===== */
  .br-swal-popup{
    background:var(--card) !important; color:var(--text) !important;
    border-radius:var(--radius-lg) !important; border:1px solid var(--line) !important;
    box-shadow:var(--shadow-pop) !important; padding-bottom:1.8em !important;
  }
  .br-swal-title{ color:var(--text) !important; font-family:var(--font-display) !important; font-size:19px !important; }
  .br-swal-popup .swal2-html-container{ margin-top:.6em !important; }
  .br-swal-popup .swal2-confirm{
    background:var(--accent) !important; border-radius:999px !important;
    box-shadow:none !important; font-family:var(--font-display) !important;
  }
  .br-swal-popup .swal2-timer-progress-bar{ background:var(--accent) !important; }

  @keyframes brSpin{ to{ transform:rotate(360deg); } }
  @keyframes brBreathe{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.08); } }
  @keyframes brDotPulse{ 0%,100%{ opacity:.4; transform:scale(.8); } 50%{ opacity:1; transform:scale(1.2); } }
  @keyframes brShimmer{ 0%{ transform:translateX(-120%); } 100%{ transform:translateX(320%); } }
  @keyframes brFillBump{ 0%{ filter:brightness(1); } 45%{ filter:brightness(1.4); } 100%{ filter:brightness(1); } }
  @keyframes brLabelSwap{ from{ opacity:0; transform:translateY(3px); } to{ opacity:1; transform:translateY(0); } }
  @keyframes brRowIn{ from{ opacity:0; transform:translateY(6px); } to{ opacity:1; transform:translateY(0); } }
  @keyframes brCheckPop{ 0%{ transform:scale(.4); opacity:0; } 60%{ transform:scale(1.15); opacity:1; } 100%{ transform:scale(1); } }

  .br-progress-icon-wrap{
    width:56px; height:56px; margin:0 auto 14px; position:relative;
    display:flex; align-items:center; justify-content:center;
  }
  .br-progress-icon-wrap::before{
    content:''; position:absolute; inset:0; border-radius:50%;
    background:conic-gradient(from 0deg, var(--accent), transparent 65%, var(--accent));
    animation:brSpin 1.5s linear infinite;
    -webkit-mask:radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px));
    mask:radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px));
    transition:background .4s cubic-bezier(.4,0,.2,1);
  }
  .br-progress-icon-wrap.br-icon-done::before{ animation-play-state:paused; background:var(--ink-in); }
  .br-progress-icon{
    position:relative; z-index:1; width:42px; height:42px; border-radius:50%;
    background:var(--card-2); display:flex; align-items:center; justify-content:center;
    box-shadow:var(--shadow-card);
    animation:brBreathe 1.8s ease-in-out infinite;
  }
  .br-progress-icon i{ font-size:19px; color:var(--accent); transition:color .3s cubic-bezier(.4,0,.2,1); }
  .br-progress-icon-wrap.br-icon-done .br-progress-icon i{ color:var(--ink-in); animation:brCheckPop .4s cubic-bezier(.4,0,.2,1); }

  .br-current-row{
    display:flex; align-items:center; justify-content:center; gap:8px;
    font-family:var(--font-mono); font-size:12.5px; color:var(--text-dim);
    min-height:18px; margin-bottom:14px; text-align:center;
  }
  .br-current-dot{
    width:6px; height:6px; border-radius:50%; background:var(--accent);
    animation:brDotPulse 1s ease-in-out infinite; flex-shrink:0;
  }
  .br-current-label{ display:inline-block; }
  .br-current-label.br-fade-swap{ animation:brLabelSwap .3s cubic-bezier(.4,0,.2,1); }

  .br-progress-track{
    position:relative; width:100%; height:9px; border-radius:999px;
    background:var(--card-2); box-shadow:var(--shadow-card); overflow:hidden;
  }
  .br-progress-fill{
    position:relative; height:100%; width:0%; border-radius:999px;
    background:linear-gradient(90deg, var(--accent2), var(--accent));
    transition:width .3s cubic-bezier(.4,0,.2,1), background .4s cubic-bezier(.4,0,.2,1);
    overflow:hidden;
  }
  .br-progress-fill.br-bump{ animation:brFillBump .35s cubic-bezier(.4,0,.2,1); }
  .br-progress-fill.br-fill-done{
    background:var(--ink-in) !important;
    box-shadow:0 0 12px 1px var(--ink-in-bg);
  }
  .br-shimmer{
    position:absolute; top:0; left:0; height:100%; width:40%;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent);
    animation:brShimmer 1.4s linear infinite;
  }
  .br-progress-fill.br-fill-done .br-shimmer{ display:none; }

  .br-progress-meta{
    display:flex; justify-content:space-between; margin-top:8px;
    font-family:var(--font-mono); font-size:11px; color:var(--text-faint);
  }

  .br-progress-log{ margin-top:16px; display:flex; flex-direction:column; gap:6px; }
  .br-log-row{
    display:flex; align-items:center; gap:8px;
    font-size:11.5px; color:var(--text-dim);
    background:var(--card-2); border-radius:10px; padding:6px 10px;
    animation:brRowIn .3s cubic-bezier(.4,0,.2,1);
  }
  .br-log-row i{ color:var(--ink-in); font-size:13px; flex-shrink:0; }
  .br-log-row span{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
</style>
</head>

<!-- ============ SEARCH PAGE ============ -->
<div class="page-shell">
  <div class="page-header">
    <span class="page-header-ico"><i class="bi bi-search"></i></span>
    <div>
      <h2>Search</h2>
      <p>Find any transaction by source, description, category, amount, or tag.</p>
    </div>
  </div>

  <div class="search-row">
    <span class="search-icon"><i class="bi bi-search"></i></span>
    <input type="text" id="searchInput" placeholder="Search by source, description, or category…" autocomplete="off" autofocus>
    <button class="search-clear" id="searchClear" type="button" title="Clear search" style="display:none;"><i class="bi bi-x-lg"></i></button>
  </div>

  <!-- Quick filter chips — one tap, no sheet needed -->
  <div class="qchip-row" id="qchipRow">
    <button class="qchip" type="button" data-qf="expense"><i class="bi bi-arrow-up-right"></i> Expense</button>
    <button class="qchip" type="button" data-qf="income"><i class="bi bi-arrow-down-left"></i> Income</button>
    <button class="qchip more" type="button" id="filterToggle"><i class="bi bi-sliders"></i> More filters</button>
  </div>

  <div class="search-toolbar">
    <button type="button" class="tb-btn" id="filterToggle2"><i class="bi bi-funnel"></i> Filters <span class="badge-count" id="filterCount" style="display:none;">0</span></button>
    <div class="sort-select-wrap">
      <select id="sortSelect">
        <option value="newest">Newest first</option>
        <option value="oldest">Oldest first</option>
        <option value="amount_desc">Highest amount</option>
        <option value="amount_asc">Lowest amount</option>
      </select>
      <i class="bi bi-chevron-down"></i>
    </div>
    <div class="tb-spacer"></div>
    <div class="export-wrap">
      <button type="button" class="tb-btn" id="exportMenuBtn" style="display:none;"><i class="bi bi-download"></i> Export</button>
      <div class="export-menu" id="exportMenu">
        <button type="button" id="downloadPdfBtn"><i class="bi bi-file-earmark-pdf"></i> Download PDF</button>
        <button type="button" id="downloadCsvBtn"><i class="bi bi-filetype-csv"></i> Export CSV</button>
      </div>
    </div>
  </div>

  <div class="search-summary" id="searchSummary"></div>
  <div class="search-status" id="searchStatus" style="display:none;"></div>
  <div id="searchResults"></div>
</div>

<!-- ============ FILTER SHEET ============ -->
<div class="sheet-backdrop" id="sheetBackdrop"></div>
<div class="filter-sheet" id="filterPanel" role="dialog" aria-modal="true" aria-label="Filters">
  <div class="sheet-handle"></div>
  <div class="sheet-head">
    <h3>Filters</h3>
    <button type="button" class="sheet-close" id="sheetCloseBtn"><i class="bi bi-x-lg"></i></button>
  </div>

  <div class="sheet-body">
    <div class="filter-grid-2col">
      <div class="sheet-section">
        <div class="sheet-section-label">Source</div>
        <div class="chip-group" id="filterSource"></div>
      </div>
      <div class="sheet-section">
        <div class="sheet-section-label">Category</div>
        <div class="chip-group" id="filterCategory"></div>
      </div>
    </div>

    <div class="sheet-section">
      <div class="sheet-section-label">Type</div>
      <div class="seg" id="typeSeg" data-value="all">
        <button type="button" class="seg-btn active" data-val="all">All</button>
        <button type="button" class="seg-btn" data-val="income">Income</button>
        <button type="button" class="seg-btn" data-val="expense">Expense</button>
      </div>
    </div>

    <div class="sheet-section">
      <div class="sheet-section-label">Date range</div>
      <div class="filter-dates">
        <div>
          <label>From</label>
          <input type="date" id="filterFrom">
        </div>
        <div>
          <label>To</label>
          <input type="date" id="filterTo">
        </div>
      </div>
    </div>

    <div class="sheet-section">
      <div class="sheet-section-label">Saved filters</div>
      <div class="preset-row">
        <input type="text" id="presetName" placeholder="Name this filter combo…" maxlength="40">
        <button type="button" id="presetSaveBtn">Save</button>
      </div>
      <div class="preset-chips" id="presetChips"></div>
    </div>
  </div>

  <div class="sheet-footer">
    <button type="button" class="btn-clear" id="filterClear">Clear all</button>
    <button type="button" class="btn-apply" id="filterApply">Apply</button>
  </div>
</div>

<div id="toast"></div>

<script src="shared.js"></script>
<script src="search.js"></script>
</body>
</html>
