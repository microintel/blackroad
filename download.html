<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Download BlackRoad</title>
<meta name="description" content="Download the BlackRoad wealth management app for Android, iOS, Windows, Ubuntu and macOS — or install it as a web app.">
<!-- Public page: no login/session check. Doesn't load auth.js on purpose. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><!-- brand icon fallback (e.g. Ubuntu) not covered by Bootstrap Icons -->
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon512_rounded.png">
<style>
  :root{
    --bg:#000000;
    --surface:#000000;
    --surface-2:#000000;
    --border:#2A2A2A;
    --text:#F5F5F5;
    --text-dim:#A7A7A7;
    --text-faint:#777777;
    --accent:#D4A62A;
    --accent-dim:#C79A25;
    --green:#35B86B;
    --radius-sm:12px;
    --radius-md:18px;
    --radius-lg:26px;
    --ease:cubic-bezier(.4,0,.2,1);
  }

  html[data-theme="light"]{
    --bg:#EFECE3;
    --surface:#FFFFFF;
    --surface-2:#F7F5EE;
    --border:#E7E2D3;
    --text:#1B1D22;
    --text-dim:#5B6270;
    --text-faint:#8A8577;
    --accent:#B8862A;
    --accent-dim:#9C7223;
    --green:#2E9E5B;
  }

  html{
    background:var(--bg);
    color-scheme:dark;
  }

  html[data-theme="light"]{
    color-scheme:light;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; min-height:100vh; background:var(--bg); color:var(--text);
    font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased;
  }
  a{ color:inherit; text-decoration:none; }

  .page{ max-width:920px; margin:0 auto; padding:28px 20px 60px; }

  .topline{
    display:flex; align-items:center; justify-content:space-between; margin-bottom:36px;
  }
  .brand{ display:flex; align-items:center; gap:14px; }
  .brand-mark{
    width:56px; height:56px; border-radius:18px;
    display:flex; align-items:center; justify-content:center;
    background:var(--accent); color:#000000;
    font-family:'Outfit',sans-serif; font-weight:800; font-size:22px;
    border:1px solid color-mix(in srgb, var(--accent) 65%, var(--border));
  }
  .brand-name{ font-family:'Outfit',sans-serif; font-weight:700; font-size:26px; letter-spacing:.1px; color:var(--text); }
  .brand-name span{ color:var(--accent); }

  .top-actions{
    display:flex;
    align-items:center;
    gap:8px;
  }

  .theme-toggle{
    width:42px;
    height:42px;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0;
    background:var(--surface);
    color:var(--text);
    border:1px solid var(--border);
    cursor:pointer;
    transition:color .2s var(--ease), border-color .2s var(--ease), background .2s var(--ease), transform .2s var(--ease);
  }

  .theme-toggle:hover{
    color:var(--accent);
    border-color:var(--accent);
    transform:translateY(-1px);
  }

  .theme-toggle:active{ transform:translateY(0); }
  .theme-toggle i{ font-size:17px; }

  .back-link{
    display:flex; align-items:center; gap:6px; font-size:13.5px; font-weight:500; color:var(--text-dim);
    padding:9px 16px; border-radius:999px; background:var(--surface); border:1px solid var(--border);
    transition:color .2s var(--ease), border-color .2s var(--ease);
  }
  .back-link:hover{ color:var(--text); border-color:var(--accent); }

  .hero{ text-align:center; margin-bottom:40px; }
  .hero-eyebrow{
    display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600; letter-spacing:.03em;
    color:var(--accent-dim); background:color-mix(in srgb, var(--accent) 12%, #fff);
    padding:6px 14px; border-radius:999px; margin-bottom:16px;
  }
  .hero h1{
    font-family:'Outfit',sans-serif; font-weight:800; font-size:clamp(26px,4.5vw,38px); margin:0 0 10px;
    letter-spacing:-.01em;
  }
  .hero p{ color:var(--text-dim); font-size:15px; max-width:520px; margin:0 auto; line-height:1.6; }

  .grid{
    display:grid; grid-template-columns:repeat(3, 1fr); gap:18px;
  }
  @media (max-width:720px){ .grid{ grid-template-columns:repeat(2, 1fr); } }
  @media (max-width:420px){
    .grid{ grid-template-columns:1fr; }
    .topline{ align-items:flex-start; gap:12px; }
    .brand-name{ font-size:22px; }
    .brand-mark{ width:48px; height:48px; border-radius:15px; }
    .top-actions{ flex-shrink:0; }
    .back-link{ padding:9px 11px; }
    .back-link{ font-size:0; }
    .back-link i{ font-size:15px; }
  }

  .card{
    display:flex; flex-direction:column; align-items:center; text-align:center; gap:14px;
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg);
    padding:32px 20px; cursor:pointer; transition:transform .22s var(--ease), border-color .22s var(--ease), background .22s var(--ease);
  }
  .card:hover{
    transform:translateY(-4px);
    border-color:color-mix(in srgb, var(--accent) 50%, var(--border));
  }
  .card:active{ transform:translateY(-1px); }
  .card.disabled{ cursor:not-allowed; opacity:.5; }
  .card.disabled:hover{ transform:none; border-color:var(--border); }

  .card-icon{
    width:96px; height:96px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    background:var(--surface-2); border:1px solid var(--border); flex-shrink:0;
  }
  .card-icon i{ font-size:44px; color:var(--accent); }
  .card.pwa .card-icon i{ color:var(--green); }

  .card-label{ font-family:'Outfit',sans-serif; font-weight:600; font-size:16px; }
  .card-sub{ font-size:12px; color:var(--text-faint); margin-top:-6px; }
  .card-sub.ready{ color:var(--green); font-weight:500; }

  footer{ text-align:center; margin-top:48px; color:var(--text-faint); font-size:12.5px; }

  #toast{
    position:fixed; left:50%; bottom:30px; transform:translateX(-50%) translateY(20px);
    background:var(--surface); color:var(--text); font-size:13.5px; font-weight:500;
    padding:12px 20px; border-radius:999px; display:flex; align-items:center; gap:9px;
    border:1px solid var(--border); opacity:0; pointer-events:none;
    transition:opacity .3s var(--ease), transform .3s var(--ease); z-index:100;
  }
  #toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  #toast i{ color:var(--green); }
</style>
</head>
<body>

<div class="page">
  <div class="topline">
    <a class="brand" href="home.html" style="text-decoration:none;color:inherit;">
      <div class="brand-mark">BR</div>
      <div class="brand-name">Black<span>Road</span></div>
    </a>
    <div class="top-actions">
      <button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch to light mode" title="Switch to light mode">
        <i class="bi bi-sun-fill"></i>
      </button>
      <a class="back-link" href="blackroad-dashboard.html"><i class="bi bi-arrow-left"></i> Back to Dashboard</a>
    </div>
  </div>

  <div class="hero">
    <div class="hero-eyebrow"><i class="bi bi-stars"></i> Get the app</div>
    <h1>Download BlackRoad</h1>
    <p>Pick your platform below to download the installer, or install BlackRoad as a web app right from your browser.</p>
  </div>

  <div class="grid" id="platformGrid"></div>

  <footer>Having trouble? Reach out from within the dashboard's Settings page.</footer>
</div>

<div id="toast"><i class="bi bi-check-circle-fill"></i><span id="toastMsg"></span></div>

<script>
  /* Theme: dark mode is the default. Preference is persisted locally. */
  const THEME_KEY = 'blackroad-theme';

  function applyTheme(theme){
    const selected = theme === 'light' ? 'light' : 'dark';
    document.documentElement.dataset.theme = selected;

    const toggle = document.getElementById('themeToggle');
    if(toggle){
      const isDark = selected === 'dark';
      toggle.innerHTML = `<i class="bi ${isDark ? 'bi-sun-fill' : 'bi-moon-fill'}"></i>`;
      toggle.setAttribute('aria-label', isDark ? 'Switch to light mode' : 'Switch to dark mode');
      toggle.setAttribute('title', isDark ? 'Switch to light mode' : 'Switch to dark mode');
    }
  }

  const savedTheme = localStorage.getItem(THEME_KEY);
  applyTheme(savedTheme || 'dark');

  document.getElementById('themeToggle').addEventListener('click', ()=>{
    const nextTheme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    localStorage.setItem(THEME_KEY, nextTheme);
    applyTheme(nextTheme);
  });

const APPS_JSON_URL = 'https://microintel.github.io/blackroad/blackroad-apps.json';

const PLATFORMS = [
  { key:'Android', label:'Android', icon:'bi bi-android2' },
  { key:'IOS',     label:'iOS',     icon:'bi bi-apple' },
  { key:'WINDOWS', label:'Windows', icon:'bi bi-windows' },
  { key:'UBUNTU',  label:'Ubuntu',  icon:'fa-brands fa-ubuntu' },
  { key:'MAC',     label:'macOS',   icon:'bi bi-apple' },
];

let toastTimer = null;
function showToast(msg, icon='bi-check-circle-fill'){
  const toast = document.getElementById('toast');
  const toastMsg = document.getElementById('toastMsg');
  toast.querySelector('i').className = 'bi ' + icon;
  toastMsg.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> toast.classList.remove('show'), 3200);
}

async function getAppLinks(){
  try{
    const res = await fetch(APPS_JSON_URL, { cache: 'no-store' });
    const data = await res.json();
    return (data && data.BlackRoadApps) || {};
  }catch(e){
    console.error('Could not load BlackRoad apps manifest', e);
    return {};
  }
}

/* ---- PWA install capture (for the "Install Web" tile) ---- */
let deferredInstallPrompt = null;
window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault();
  deferredInstallPrompt = e;
  renderGrid(); // re-render so the "Install Web" tile becomes enabled
});
window.addEventListener('appinstalled', ()=>{
  deferredInstallPrompt = null;
  showToast('BlackRoad installed successfully', 'bi-check-circle-fill');
  renderGrid();
});
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{ /* offline scaffolding is optional */ });
  });
}

let cachedLinks = null;

function cardMarkup(p, url){
  const available = !!url;
  return `
    <div class="card ${available ? '' : 'disabled'}" data-platform="${p.key}">
      <div class="card-icon"><i class="${p.icon}"></i></div>
      <div class="card-label">${p.label}</div>
      <div class="card-sub">${available ? 'Download installer' : 'Coming soon'}</div>
    </div>`;
}

function pwaCardMarkup(){
  const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
  const available = !!deferredInstallPrompt && !isStandalone;
  return `
    <div class="card pwa ${available ? '' : 'disabled'}" data-platform="PWA">
      <div class="card-icon"><i class="bi bi-globe2"></i></div>
      <div class="card-label">Install Web</div>
      <div class="card-sub ${available ? 'ready' : ''}">${
        isStandalone ? 'Already installed' : (available ? 'Ready to install' : 'Not available in this browser')
      }</div>
    </div>`;
}

async function renderGrid(){
  const grid = document.getElementById('platformGrid');
  if(!cachedLinks) cachedLinks = await getAppLinks();
  const links = cachedLinks;
  grid.innerHTML = PLATFORMS.map(p => cardMarkup(p, links[p.key])).join('') + pwaCardMarkup();

  grid.querySelectorAll('.card').forEach(card=>{
    card.addEventListener('click', async ()=>{
      const key = card.getAttribute('data-platform');
      if(key === 'PWA'){
        if(!deferredInstallPrompt) return;
        deferredInstallPrompt.prompt();
        const { outcome } = await deferredInstallPrompt.userChoice;
        deferredInstallPrompt = null;
        showToast(outcome === 'accepted' ? 'BlackRoad installed — check your home screen' : 'Install dismissed', outcome === 'accepted' ? 'bi-check-circle-fill' : 'bi-info-circle-fill');
        renderGrid();
        return;
      }
      const url = links[key];
      if(!url) return;
      const platform = PLATFORMS.find(p=>p.key === key);
      const a = document.createElement('a');
      a.href = url;
      a.rel = 'noopener';
      document.body.appendChild(a);
      a.click();
      a.remove();
      showToast(`Downloading BlackRoad for ${platform.label}…`, 'bi-download');
    });
  });
}

renderGrid();
</script>

</body>
</html>
