<!-- ============ LOANS (bank loans & EMI) ============ -->
<main id="ledger">
  <div class="ledger-toolbar">
    <div class="ledger-head">
      <h2>Loans</h2>
      <button class="add-income-btn top-add-income-btn" id="addLoanBtn" type="button"><i class="bi bi-plus-lg"></i> Add loan</button>
    </div>

    <div class="quick-stats">
      <div class="qs-item qs-out">
        <span class="qs-ico"><i class="bi bi-bank2"></i></span>
        <span class="qs-label">Loan balance</span>
        <span class="qs-val" id="qsLoanBalance">₹0</span>
      </div>
      <div class="qs-item qs-out">
        <span class="qs-ico"><i class="bi bi-arrow-repeat"></i></span>
        <span class="qs-label">Monthly EMI</span>
        <span class="qs-val" id="qsMonthlyEmi">₹0</span>
      </div>
      <div class="qs-item qs-count">
        <span class="qs-ico"><i class="bi bi-collection"></i></span>
        <span class="qs-label">Active loans</span>
        <span class="qs-val" id="qsCount">0</span>
      </div>
      <div class="qs-item qs-net">
        <span class="qs-ico"><i class="bi bi-calendar-event"></i></span>
        <span class="qs-label">Next due</span>
        <span class="qs-val" id="qsNextDue">—</span>
      </div>
    </div>
  </div>

  <div id="loansBody"><!-- rendered by loans.js --></div>
</main>

<!-- ============ ADD/EDIT LOAN DIALOG (bank loan / EMI schedule) ============ -->
<dialog id="loanDialog">
  <form class="dialog-inner" id="loanForm">
    <h3 id="loanDialogTitle"><i class="bi bi-bank2"></i> Add loan</h3>
    <div class="field">
      <label for="loanLender">Lender</label>
      <input type="text" id="loanLender" placeholder="e.g. HDFC Bank — Car loan" required>
    </div>
    <div class="field">
      <label for="loanPrincipal">Principal amount</label>
      <input type="number" id="loanPrincipal" step="0.01" min="0" required>
    </div>
    <div class="field">
      <label for="loanEmi">EMI amount</label>
      <input type="number" id="loanEmi" step="0.01" min="0" required>
    </div>
    <div class="field">
      <label for="loanTenure">Tenure (months)</label>
      <input type="number" id="loanTenure" step="1" min="1" required>
    </div>
    <div class="field">
      <label for="loanRate">Interest rate % p.a. (optional)</label>
      <input type="number" id="loanRate" step="0.01" min="0">
    </div>
    <div class="field">
      <label for="loanStart">Start date (first EMI)</label>
      <input type="date" id="loanStart" required>
    </div>
    <div class="field">
      <label for="loanNotes">Notes (optional)</label>
      <input type="text" id="loanNotes" placeholder="e.g. Account ending 4821">
    </div>
    <div class="dialog-actions">
      <button type="button" class="btn" data-close="loanDialog">Cancel</button>
      <button type="submit" class="btn primary">Save</button>
    </div>
  </form>
</dialog>

<!-- ============ RECORD PAYMENT DIALOG ============ -->
<dialog id="paymentDialog">
  <form class="dialog-inner" id="paymentForm">
    <h3 id="paymentDialogTitle"><i class="bi bi-cash-coin"></i> Pay EMI</h3>
    <div class="field">
      <label for="payAmount">Amount</label>
      <input type="number" id="payAmount" step="0.01" min="0" required>
    </div>
    <div class="field">
      <label for="payDate">Date</label>
      <input type="date" id="payDate" required>
    </div>
    <div class="field">
      <label for="payNote">Note (optional)</label>
      <input type="text" id="payNote" placeholder="e.g. Partial repayment">
    </div>
    <div class="dialog-actions">
      <button type="button" class="btn" data-close="paymentDialog">Cancel</button>
      <button type="submit" class="btn primary">Save</button>
    </div>
  </form>
</dialog>

<!-- ============ CONFIRM DELETE DIALOG ============ -->
<dialog id="confirmDialog">
  <div class="dialog-inner">
    <h3 id="confirmTitle"><i class="bi bi-exclamation-triangle"></i> Delete this?</h3>
    <p id="confirmBody" style="color:var(--text-dim); font-size:0.86rem; margin-top:-8px;"></p>
    <div class="dialog-actions">
      <button type="button" class="btn" data-close="confirmDialog">Cancel</button>
      <button type="button" class="btn danger-solid" id="confirmYesBtn"><i class="bi bi-trash3"></i> Delete</button>
    </div>
  </div>
</dialog>

<div id="toast"></div>
