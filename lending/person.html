<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

  (function(){ try{
    var t = localStorage.getItem('br-theme');
    if (t === 'light') document.documentElement.setAttribute('data-theme', 'paper');
  }catch(e){} })();

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="people">

<!-- ============ LEFT NAVIGATION (persistent, same on every page) ============ -->
<a href="../blackroad-dashboard.html" class="mobile-back-btn" aria-label="Back to BlackRoad">
  <i class="bi bi-arrow-left"></i>
</a>
<nav class="side-nav" aria-label="Main menu">
  <div class="side-nav-brand">
    <span class="mark"></span>
    <h1>LendLedger</h1>
  </div>

  <div class="side-nav-links">
    <a href="../blackroad-dashboard.html" class="side-nav-item side-nav-back nav-desktop-only">
      <span class="side-nav-ico"><i class="bi bi-arrow-left-circle"></i></span><span class="side-nav-label">Back to BlackRoad</span>
    </a>
    <a href="index.html" class="side-nav-item" data-page="dashboard">
      <span class="side-nav-ico"><i class="bi bi-grid-1x2-fill"></i></span><span class="side-nav-label">Dashboard</span>
    </a>
    <a href="people.html" class="side-nav-item" data-page="people">
      <span class="side-nav-ico"><i class="bi bi-people-fill"></i></span><span class="side-nav-label">People</span>
    </a>
    <a href="loans.html" class="side-nav-item" data-page="loans">
      <span class="side-nav-ico"><i class="bi bi-bank2"></i></span><span class="side-nav-label">Loans</span>
    </a>
    <button type="button" class="side-nav-item nav-desktop-only js-export-data">
      <span class="side-nav-ico"><i class="bi bi-download"></i></span><span class="side-nav-label">Export data</span>
    </button>
    <button type="button" class="side-nav-item nav-desktop-only js-import-data">
      <span class="side-nav-ico"><i class="bi bi-upload"></i></span><span class="side-nav-label">Import data</span>
    </button>
    <button type="button" class="side-nav-item mobile-tab-btn" id="mobileAddPersonBtn">
      <span class="side-nav-ico"><i class="bi bi-plus-circle-fill"></i></span><span class="side-nav-label">Add person</span>
    </button>
    <button type="button" class="side-nav-item mobile-tab-btn" id="mobileAccountToggle">
      <span class="side-nav-ico"><i class="bi bi-three-dots"></i></span><span class="side-nav-label">More</span>
    </button>
  </div>

  <input type="file" id="importFileInput" accept="application/json" hidden>

  <div class="side-nav-section" id="accountSheet">
    <div class="mobile-only-section">
      <div class="side-nav-label-hdr">Data</div>
      <div class="side-nav-tools-list">
        <button type="button" class="tool-item js-export-data">
          <span class="side-nav-ico"><i class="bi bi-download"></i></span><span>Export data</span>
        </button>
        <button type="button" class="tool-item js-import-data">
          <span class="side-nav-ico"><i class="bi bi-upload"></i></span><span>Import data</span>
        </button>
      </div>
    </div>
  </div>
</nav>

<!-- ============ PERSON LEDGER ============ -->
<main id="ledger">
  <div class="ledger-toolbar">
    <div class="ledger-head">
      <h2>
        <a href="people.html" class="ghost-btn" style="margin-right:8px;"><i class="bi bi-arrow-left"></i></a>
        <span id="personName">Person</span>
      </h2>
      <div style="display:flex; gap:8px;">
        <button class="ghost-btn" id="editPersonBtn" type="button"><i class="bi bi-pencil"></i> Edit</button>
        <button class="add-income-btn" id="addEntryBtn" type="button"><i class="bi bi-plus-lg"></i> Add entry</button>
      </div>
    </div>

    <!-- ---- Balance summary ---- -->
    <div class="quick-stats" id="quickStats" style="grid-template-columns:repeat(3,1fr);">
      <div class="qs-item qs-in">
        <span class="qs-ico"><i class="bi bi-arrow-down-left"></i></span>
        <span class="qs-label">You gave</span>
        <span class="qs-val" id="statGave">₹0</span>
      </div>
      <div class="qs-item qs-out">
        <span class="qs-ico"><i class="bi bi-arrow-up-right"></i></span>
        <span class="qs-label">You got</span>
        <span class="qs-val" id="statGot">₹0</span>
      </div>
      <div class="qs-item qs-net">
        <span class="qs-ico"><i class="bi bi-wallet2"></i></span>
        <span class="qs-label" id="statBalanceLabel">Balance</span>
        <span class="qs-val" id="statBalance">₹0</span>
      </div>
    </div>
  </div>

  <div id="ledgerBody"><!-- rendered by person.js --></div>
</main>

<!-- ============ ADD/EDIT ENTRY DIALOG ============ -->
<dialog id="entryDialog">
  <form class="dialog-inner" id="entryForm">
    <h3 id="entryDialogTitle"><i class="bi bi-arrow-down-left"></i> Add entry</h3>
    <div class="field">
      <label for="entryType">Type</label>
      <select id="entryType" required>
        <option value="gave">You gave (increases what they owe you)</option>
        <option value="got">You got (decreases what they owe you)</option>
      </select>
    </div>
    <div class="field">
      <label for="entryAmount">Amount</label>
      <input type="number" id="entryAmount" step="0.01" min="0" required>
    </div>
    <div class="field">
      <label for="entryDate">Date</label>
      <input type="date" id="entryDate" required>
    </div>
    <div class="field">
      <label for="entryDueDate">Due date (optional)</label>
      <input type="date" id="entryDueDate">
    </div>
    <div class="field">
      <label for="entryNote">Note (optional)</label>
      <input type="text" id="entryNote" placeholder="e.g. cash, bank transfer">
    </div>
    <div class="dialog-actions">
      <button type="button" class="btn" data-close="entryDialog">Cancel</button>
      <button type="submit" class="btn primary">Save</button>
    </div>
  </form>
</dialog>

<!-- ============ EDIT PERSON DIALOG ============ -->
<dialog id="personDialog">
  <form class="dialog-inner" id="personForm">
    <h3><i class="bi bi-person"></i> Edit person</h3>
    <div class="field">
      <label for="personName">Name</label>
      <input type="text" id="personNameInput" required>
    </div>
    <div class="field">
      <label for="personPhone">Phone (optional)</label>
      <input type="text" id="personPhoneInput">
    </div>
    <div class="field">
      <label for="personNote">Note (optional)</label>
      <input type="text" id="personNoteInput">
    </div>
    <div class="dialog-actions">
      <button type="button" class="btn" data-close="personDialog">Cancel</button>
      <button type="submit" class="btn primary">Save</button>
    </div>
  </form>
</dialog>

<!-- ============ CONFIRM DELETE DIALOG ============ -->
<dialog id="confirmDialog">
  <div class="dialog-inner">
    <h3 id="confirmTitle"><i class="bi bi-exclamation-triangle"></i> Delete this?</h3>
    <p id="confirmBody" style="color:var(--text-dim); font-size:0.86rem; margin-top:-8px;"></p>
    <div class="dialog-actions">
      <button type="button" class="btn" data-close="confirmDialog">Cancel</button>
      <button type="button" class="btn danger-solid" id="confirmYesBtn"><i class="bi bi-trash3"></i> Delete</button>
    </div>
  </div>
</dialog>

<div id="toast"></div>

<script src="shared.js"></script>
<script src="person.js"></script>
</body>
</html>
