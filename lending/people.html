<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LendLedger — People</title>
<script>
  (function(){ try{
    var t = localStorage.getItem('ll-theme');
    if (t && t !== 'soft') document.documentElement.setAttribute('data-theme', t);
  }catch(e){} })();
</script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="people">

<!-- ============ LEFT NAVIGATION (persistent, same on every page) ============ -->
<nav class="side-nav" aria-label="Main menu">
  <div class="side-nav-brand">
    <span class="mark"></span>
    <h1>LendLedger</h1>
  </div>

  <div class="side-nav-links">
    <a href="../blackroad-dashboard.html" class="side-nav-item side-nav-back nav-desktop-only">
      <span class="side-nav-ico"><i class="bi bi-arrow-left-circle"></i></span><span class="side-nav-label">Back to BlackRoad</span>
    </a>
    <a href="index.html" class="side-nav-item" data-page="dashboard">
      <span class="side-nav-ico"><i class="bi bi-grid-1x2-fill"></i></span><span class="side-nav-label">Dashboard</span>
    </a>
    <a href="people.html" class="side-nav-item" data-page="people">
      <span class="side-nav-ico"><i class="bi bi-people-fill"></i></span><span class="side-nav-label">People</span>
    </a>
    <a href="loans.html" class="side-nav-item" data-page="loans">
      <span class="side-nav-ico"><i class="bi bi-bank2"></i></span><span class="side-nav-label">Loans</span>
    </a>
    <button type="button" class="side-nav-item nav-desktop-only js-export-data">
      <span class="side-nav-ico"><i class="bi bi-download"></i></span><span class="side-nav-label">Export data</span>
    </button>
    <button type="button" class="side-nav-item nav-desktop-only js-import-data">
      <span class="side-nav-ico"><i class="bi bi-upload"></i></span><span class="side-nav-label">Import data</span>
    </button>
    <button type="button" class="side-nav-item mobile-tab-btn" id="mobileAddPersonBtn">
      <span class="side-nav-ico"><i class="bi bi-plus-circle-fill"></i></span><span class="side-nav-label">Add person</span>
    </button>
    <button type="button" class="side-nav-item mobile-tab-btn" id="mobileAccountToggle">
      <span class="side-nav-ico"><i class="bi bi-three-dots"></i></span><span class="side-nav-label">More</span>
    </button>
  </div>

  <input type="file" id="importFileInput" accept="application/json" hidden>

  <div class="side-nav-section" id="accountSheet">
    <div class="side-nav-label-hdr">Appearance</div>
    <div class="side-nav-themes">
      <button class="swatch" data-theme="paper" title="White">
        <span class="swatch-ico ico-paper"><i class="bi bi-sun-fill"></i></span>
        <span class="side-nav-label">White</span>
        <span class="swatch-check"><i class="bi bi-check-circle-fill"></i></span>
      </button>
      <button class="swatch" data-theme="soft" title="Noir">
        <span class="swatch-ico ico-soft"><i class="bi bi-moon-stars-fill"></i></span>
        <span class="side-nav-label">Noir</span>
        <span class="swatch-check"><i class="bi bi-check-circle-fill"></i></span>
      </button>
      <button class="swatch" data-theme="dusk" title="Dusk">
        <span class="swatch-ico ico-dusk"><i class="bi bi-cloud-moon-fill"></i></span>
        <span class="side-nav-label">Dusk</span>
        <span class="swatch-check"><i class="bi bi-check-circle-fill"></i></span>
      </button>
      <button class="swatch" data-theme="brass" title="Brass Ledger">
        <span class="swatch-ico ico-brass"><i class="bi bi-gem"></i></span>
        <span class="side-nav-label">Brass Ledger</span>
        <span class="swatch-check"><i class="bi bi-check-circle-fill"></i></span>
      </button>
    </div>

    <div class="mobile-only-section">
      <div class="side-nav-label-hdr">Data</div>
      <div class="side-nav-tools-list">
        <a href="../blackroad-dashboard.html" class="tool-item">
          <span class="side-nav-ico"><i class="bi bi-arrow-left-circle"></i></span><span>Back to BlackRoad</span>
        </a>
        <button type="button" class="tool-item js-export-data">
          <span class="side-nav-ico"><i class="bi bi-download"></i></span><span>Export data</span>
        </button>
        <button type="button" class="tool-item js-import-data">
          <span class="side-nav-ico"><i class="bi bi-upload"></i></span><span>Import data</span>
        </button>
      </div>
    </div>
  </div>
</nav>

<!-- ============ PEOPLE DIRECTORY ============ -->
<main id="ledger">
  <div class="ledger-toolbar">
    <div class="ledger-head">
      <h2>People</h2>
      <button class="add-income-btn top-add-income-btn" id="addPersonBtn" type="button"><i class="bi bi-plus-lg"></i> Add person</button>
    </div>

    <div class="filter-row">
      <div class="date-filter">
        <i class="bi bi-search"></i>
        <input type="text" id="searchInput" placeholder="Search people" style="background:transparent;border:none;color:inherit;font-family:inherit;font-size:0.85rem;width:160px;">
      </div>
      <div class="date-filter">
        <i class="bi bi-funnel"></i>
        <select id="balanceFilter" style="background:transparent;border:none;color:inherit;font-family:inherit;font-size:0.85rem;">
          <option value="">Everyone</option>
          <option value="get">You'll get</option>
          <option value="give">You'll give</option>
          <option value="settled">Settled</option>
        </select>
      </div>
    </div>

    <div class="search-status" id="searchStatus" style="display:none;"></div>
  </div>

  <div id="peopleBody"><!-- rendered by people.js --></div>
</main>

<!-- ============ ADD/EDIT PERSON DIALOG ============ -->
<dialog id="personDialog">
  <form class="dialog-inner" id="personForm">
    <h3 id="personDialogTitle"><i class="bi bi-person-plus"></i> Add person</h3>
    <div class="field">
      <label for="personName">Name</label>
      <input type="text" id="personName" placeholder="e.g. Rahul, Dad, ABC Finance" required>
    </div>
    <div class="field">
      <label for="personPhone">Phone (optional)</label>
      <input type="text" id="personPhone" placeholder="e.g. 98765 43210">
    </div>
    <div class="field">
      <label for="personNote">Note (optional)</label>
      <input type="text" id="personNote" placeholder="e.g. college friend">
    </div>
    <div class="dialog-actions">
      <button type="button" class="btn" data-close="personDialog">Cancel</button>
      <button type="submit" class="btn primary">Save</button>
    </div>
  </form>
</dialog>

<!-- ============ CONFIRM DELETE DIALOG ============ -->
<dialog id="confirmDialog">
  <div class="dialog-inner">
    <h3 id="confirmTitle"><i class="bi bi-exclamation-triangle"></i> Delete this?</h3>
    <p id="confirmBody" style="color:var(--text-dim); font-size:0.86rem; margin-top:-8px;"></p>
    <div class="dialog-actions">
      <button type="button" class="btn" data-close="confirmDialog">Cancel</button>
      <button type="button" class="btn danger-solid" id="confirmYesBtn"><i class="bi bi-trash3"></i> Delete</button>
    </div>
  </div>
</dialog>

<div id="toast"></div>

<script src="shared.js"></script>
<script src="people.js"></script>
</body>
</html>
