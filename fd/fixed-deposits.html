<div id="toast"></div>

<script src="deposits-store.js"></script>
<script>
/* =========================================================
   FIXED DEPOSITS — page script
   Uses DepositsStore (js/deposits-store.js) for all IndexedDB
   reads/writes — the exact same store the dashboard's inlined
   copy reads from, so both stay in sync automatically.
========================================================= */

let FDS = [];
let openIds = new Set();

const STATUS_LABEL = { "active": "Active", "maturing-soon": "Maturing soon", "matured": "Matured", "closed": "Closed" };
const STATUS_RANK = { "matured": 0, "maturing-soon": 1, "active": 2, "closed": 3 };

/* ---------------- Formatting / misc utilities (mirrors lending/shared.js) ---------------- */

function fmtMoney(n) { return DepositsStore.formatINR(Number(n) || 0); }
function todayISO() { return new Date().toISOString().slice(0, 10); }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function escapeHTML(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}
function daysUntil(dateStr) {
  const d = new Date(dateStr + "T00:00:00");
  if (isNaN(d)) return null;
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  return Math.round((d - today) / 86400000);
}
function showToast(msg) {
  const el = document.getElementById("toast");
  if (!el) return;
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => el.classList.remove("show"), 2200);
}

/* ---------------- Theme system (shared localStorage key with lending) ---------------- */

const THEME_KEY = "ll-theme";
function getStoredTheme() {
  try { return localStorage.getItem(THEME_KEY) || "soft"; }
  catch (e) { return "soft"; }
}
function applyTheme(theme) {
  if (theme === "soft") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", theme);
  try { localStorage.setItem(THEME_KEY, theme); } catch (e) {}
  document.querySelectorAll(".swatch").forEach((btn) => {
    btn.classList.toggle("active", btn.dataset.theme === theme);
  });
}
function initSideNav() {
  document.querySelectorAll(".swatch").forEach((btn) => {
    btn.classList.toggle("active", btn.dataset.theme === getStoredTheme());
    btn.addEventListener("click", () => applyTheme(btn.dataset.theme));
  });
}
function initMobileSheets() {
  const groups = [
    { toggle: document.getElementById("mobileAccountToggle"), sheet: document.getElementById("accountSheet") },
  ].filter((g) => g.toggle && g.sheet);
  if (!groups.length) return;
  let backdrop = document.querySelector(".mobile-nav-backdrop");
  if (!backdrop) {
    backdrop = document.createElement("div");
    backdrop.className = "mobile-nav-backdrop";
    document.body.appendChild(backdrop);
  }
  function closeAll() {
    groups.forEach((g) => g.sheet.classList.remove("mobile-open"));
    backdrop.classList.remove("show");
  }
  function openSheet(sheet) {
    groups.forEach((g) => g.sheet.classList.toggle("mobile-open", g.sheet === sheet));
    backdrop.classList.add("show");
  }
  groups.forEach((g) => {
    g.toggle.addEventListener("click", () => {
      g.sheet.classList.contains("mobile-open") ? closeAll() : openSheet(g.sheet);
    });
  });
  backdrop.addEventListener("click", closeAll);
  document.querySelectorAll(".swatch, .tool-item").forEach((btn) => {
    btn.addEventListener("click", closeAll);
  });
  window.addEventListener("resize", () => { if (window.innerWidth >= 900) closeAll(); });
}

/* ---------------- Refresh / summary ---------------- */

async function refresh() {
  FDS = await DepositsStore.getAll();
  renderQuickStats();
  renderBody();
}

function renderQuickStats() {
  const summary_ = summarize();
  document.getElementById("qsInvested").textContent = fmtMoney(summary_.totalInvested);
  document.getElementById("qsCurrentValue").textContent = fmtMoney(summary_.totalCurrentValue);
  document.getElementById("qsCount").textContent = String(summary_.activeCount);

  const el = document.getElementById("qsNextMaturity");
  if (summary_.nextMaturity) {
    const days = daysUntil(summary_.nextMaturity.date);
    const when = days < 0 ? `${Math.abs(days)}d overdue` : days === 0 ? "Today" : `in ${days}d`;
    el.textContent = `${escapeHTML(summary_.nextMaturity.bankName)} · ${when}`;
  } else {
    el.textContent = "—";
  }
}

function summarize() {
  let totalInvested = 0, totalCurrentValue = 0, activeCount = 0, nextMaturity = null;
  FDS.forEach((r) => {
    const m = DepositsStore.computeMetrics(r);
    if (r.status !== "closed") {
      totalInvested += Number(r.principal) || 0;
      totalCurrentValue += m.currentValue;
      activeCount += 1;
      if (m.maturityDate && (!nextMaturity || m.maturityDate < nextMaturity.date)) {
        nextMaturity = { date: m.maturityDate, bankName: r.bankName || "Fixed Deposit" };
      }
    }
  });
  return { totalInvested, totalCurrentValue, activeCount, nextMaturity };
}

/* ---------------- Rendering ---------------- */

function renderBody() {
  const body = document.getElementById("depositsBody");

  if (FDS.length === 0) {
    body.innerHTML = `
      <div class="empty-state">
        <span class="mark-big"><i class="bi bi-bank2"></i></span>
        <h3>No fixed deposits yet</h3>
        <p>Add a bank FD or bond to track its maturity value and interest earned.</p>
        <button class="add-income-btn" onclick="document.getElementById('addFdBtn').click()"><i class="bi bi-plus-lg"></i> Add deposit</button>
      </div>`;
    return;
  }

  const sorted = [...FDS].sort((a, b) => {
    const ma = DepositsStore.computeMetrics(a), mb = DepositsStore.computeMetrics(b);
    if (STATUS_RANK[ma.status] !== STATUS_RANK[mb.status]) return STATUS_RANK[ma.status] - STATUS_RANK[mb.status];
    const da = ma.maturityDate || "9999-99-99", db_ = mb.maturityDate || "9999-99-99";
    return da < db_ ? -1 : da > db_ ? 1 : 0;
  });

  body.innerHTML = `<div class="spine">${sorted.map(renderCard).join("")}</div>`;
}

function renderCard(r) {
  const isOpen = openIds.has(r.id);
  const m = DepositsStore.computeMetrics(r);
  const status = m.status;
  const tenureYears = (Number(r.tenureMonths) || 0) / 12;
  const pct = tenureYears > 0 && r.startDate
    ? Math.min(100, Math.round(((new Date() - new Date(r.startDate + "T00:00:00")) / (tenureYears * 365.25 * 86400000)) * 100))
    : 0;
  const title = r.bankName || "Fixed deposit";

  const maturityLine = m.maturityDate
    ? `<div class="lend-sub-item ${status === "matured" || status === "maturing-soon" ? "warn" : ""}"><i class="bi bi-calendar-event"></i> Matures <b>${m.maturityDate}</b></div>`
    : `<div class="lend-sub-item"><i class="bi bi-calendar-x"></i> No maturity date</div>`;

  const rateLine = `<div class="lend-sub-item"><i class="bi bi-percent"></i> <b>${r.interestRate || 0}%</b> p.a. · ${escapeHTML((r.compounding || "quarterly"))}</div>
       <div class="lend-sub-item"><i class="bi bi-graph-up-arrow"></i> Est. maturity value <b>${fmtMoney(m.maturityAmount)}</b></div>`;

  const closeAction = status === "closed"
    ? ""
    : `<button class="icon-btn add" title="Mark as closed / matured" onclick="event.stopPropagation(); openCloseDialog(${r.id})"><i class="bi bi-check2-circle"></i></button>`;

  return `
    <div class="entry ${isOpen ? "open" : ""}" data-id="${r.id}">
      <div class="entry-card">
        <div class="entry-head" onclick="toggleCard(${r.id})">
          <div class="entry-row-top">
            <div class="entry-from">${escapeHTML(title)}</div>
            <div class="lend-amt out">${fmtMoney(r.principal)}</div>
            <div class="entry-actions">
              ${closeAction}
            </div>
          </div>
          <div class="entry-row-bottom">
            <span class="status-pill status-${status === "maturing-soon" ? "due-soon" : status === "matured" ? "overdue" : status === "closed" ? "settled" : "open"}">${STATUS_LABEL[status]}</span>
            <div class="entry-meta-pills">
              <span class="entry-expense">Current value&nbsp;${fmtMoney(m.currentValue)}</span>
            </div>
          </div>
          <div class="lend-progress"><div class="lend-progress-fill ${status === "matured" || status === "closed" ? "settled" : ""}" style="width:${pct}%"></div></div>
          <div class="lend-sub">
            ${maturityLine}
            ${rateLine}
          </div>
        </div>
        <div class="entry-body">
          <div class="entry-body-actions">
            <button class="body-action-btn" type="button" onclick="event.stopPropagation(); openFdDialog(${r.id})"><i class="bi bi-pencil"></i> Edit</button>
            <button class="body-action-btn danger" type="button" onclick="event.stopPropagation(); confirmDeleteFd(${r.id})"><i class="bi bi-trash3"></i> Delete</button>
          </div>
          ${r.notes ? `<div class="no-txns" style="padding-top:2px;"><i class="bi bi-sticky"></i> ${escapeHTML(r.notes)}</div>` : ""}
          ${status === "closed" ? `<div class="no-txns"><i class="bi bi-check2-circle"></i> Closed ${escapeHTML(r.closedDate || "")} · Received ${fmtMoney(r.closedAmount)}</div>` : ""}
        </div>
      </div>
    </div>`;
}

function toggleCard(id) {
  if (openIds.has(id)) openIds.delete(id); else openIds.add(id);
  renderBody();
}

/* ---------------- Dialog helpers ---------------- */

function openDialog(id) {
  const el = document.getElementById(id);
  if (el.open) return;
  el.showModal();
}
function closeDialog(id) { document.getElementById(id).close(); }
document.querySelectorAll("[data-close]").forEach((btn) => {
  btn.addEventListener("click", () => closeDialog(btn.dataset.close));
});

document.getElementById("addFdBtn").addEventListener("click", () => openFdDialog(null));

/* -- Add/edit deposit -- */
let editingFdId = null;

function openFdDialog(id) {
  editingFdId = id || null;
  const r = id ? FDS.find((x) => x.id === id) : null;
  const form = document.getElementById("fdForm");
  form.reset();
  document.getElementById("fdStart").value = todayISO();
  document.getElementById("fdCompounding").value = "quarterly";
  document.getElementById("fdDialogTitle").textContent = r ? "Edit deposit" : "Add deposit";
  if (r) {
    document.getElementById("fdBank").value = r.bankName || "";
    document.getElementById("fdPrincipal").value = r.principal;
    document.getElementById("fdRate").value = r.interestRate;
    document.getElementById("fdCompounding").value = r.compounding || "quarterly";
    document.getElementById("fdTenure").value = r.tenureMonths;
    document.getElementById("fdStart").value = r.startDate;
    document.getElementById("fdNotes").value = r.notes || "";
  }
  openDialog("fdDialog");
}

document.getElementById("fdForm").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const record = {
    bankName: document.getElementById("fdBank").value.trim(),
    principal: parseFloat(document.getElementById("fdPrincipal").value) || 0,
    interestRate: parseFloat(document.getElementById("fdRate").value) || 0,
    compounding: document.getElementById("fdCompounding").value,
    tenureMonths: parseInt(document.getElementById("fdTenure").value, 10) || 1,
    startDate: document.getElementById("fdStart").value,
    notes: document.getElementById("fdNotes").value.trim(),
  };

  try {
    if (editingFdId) {
      await DepositsStore.update(editingFdId, record);
      showToast("Deposit updated");
    } else {
      await DepositsStore.add(record);
      showToast("Deposit added");
    }
    editingFdId = null;
    closeDialog("fdDialog");
    await refresh();
  } catch (err) {
    console.error("Failed to save deposit:", err);
    showToast("Couldn't save — " + (err && err.message ? err.message : "database error"));
  }
});

/* -- Close / mark-as-matured dialog -- */
let closingFdId = null;

function openCloseDialog(id) {
  closingFdId = id;
  const r = FDS.find((x) => x.id === id);
  const m = DepositsStore.computeMetrics(r);
  document.getElementById("closeForm").reset();
  document.getElementById("closeAmount").value = Math.round(m.maturityAmount * 100) / 100;
  document.getElementById("closeDate").value = todayISO();
  openDialog("closeDialog");
}

document.getElementById("closeForm").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const closedAmount = parseFloat(document.getElementById("closeAmount").value) || 0;
  const closedDate = document.getElementById("closeDate").value;
  try {
    await DepositsStore.update(closingFdId, { status: "closed", closedAmount, closedDate });
    showToast("Deposit closed");
    closeDialog("closeDialog");
    await refresh();
  } catch (err) {
    console.error("Failed to close deposit:", err);
    showToast("Couldn't save — " + (err && err.message ? err.message : "database error"));
  }
});

/* -- Confirm delete dialog -- */
let pendingDeleteId = null;

function confirmDeleteFd(id) {
  const r = FDS.find((x) => x.id === id);
  pendingDeleteId = id;
  document.getElementById("confirmTitle").textContent = "Delete this deposit?";
  document.getElementById("confirmBody").textContent =
    `This removes "${r.bankName || "this deposit"}" permanently. This can't be undone.`;
  openDialog("confirmDialog");
}

document.getElementById("confirmYesBtn").addEventListener("click", async () => {
  if (pendingDeleteId == null) return;
  try {
    await DepositsStore.remove(pendingDeleteId);
    showToast("Deposit deleted");
  } catch (err) {
    console.error("Failed to delete:", err);
    showToast("Couldn't delete — " + (err && err.message ? err.message : "database error"));
  }
  pendingDeleteId = null;
  closeDialog("confirmDialog");
  await refresh();
});

/* ---------- Import / Export (backup of this page's deposits store) ---------- */

function collectExportPayload() {
  return DepositsStore.getAll().then((deposits) => ({
    app: "BlackRoad Fixed Deposits",
    version: 1,
    exportedAt: new Date().toISOString(),
    deposits,
  }));
}

function exportData() {
  collectExportPayload()
    .then((payload) => {
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `fixed-deposits-backup-${todayISO()}.json`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      showToast("Data exported");
    })
    .catch(() => showToast("Export failed"));
}

function importDataFromFile(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    let data;
    try {
      data = JSON.parse(reader.result);
    } catch (e) {
      showToast("That file isn't a valid backup");
      return;
    }
    const hasStore = data && Array.isArray(data.deposits);
    if (!hasStore) {
      showToast("That file isn't a valid backup");
      return;
    }
    const confirmed = window.confirm(
      "Importing will replace all current fixed deposits with the contents of this backup. This can't be undone. Continue?"
    );
    if (!confirmed) return;

    DepositsStore.getAll()
      .then((existing) => Promise.all(existing.map((d) => DepositsStore.remove(d.id))))
      .then(() => Promise.all((data.deposits || []).map((d) => DepositsStore.put(d))))
      .then(() => {
        showToast("Data imported — reloading…");
        setTimeout(() => window.location.reload(), 700);
      })
      .catch(() => showToast("Import failed"));
  };
  reader.readAsText(file);
}

function initImportExport() {
  document.querySelectorAll(".js-export-data").forEach((btn) => {
    btn.addEventListener("click", exportData);
  });
  const fileInput = document.getElementById("importFileInput");
  document.querySelectorAll(".js-import-data").forEach((btn) => {
    btn.addEventListener("click", () => fileInput && fileInput.click());
  });
  if (fileInput) {
    fileInput.addEventListener("change", () => {
      const file = fileInput.files && fileInput.files[0];
      importDataFromFile(file);
      fileInput.value = "";
    });
  }
}

/* ---------------- Boot ---------------- */

document.addEventListener("DOMContentLoaded", () => {
  initSideNav();
  initMobileSheets();
  initImportExport();
});

(async function init() {
  try {
    await refresh();
    // Re-sync instantly if the dashboard (another tab) touches this data
    DepositsStore.onChange(() => refresh());
  } catch (err) {
    console.error("Fixed Deposits DB error:", err);
    showToast("Could not open local database — " + (err && err.message ? err.message : "try clearing site data"));
  }
})();
</script>
</body>
</html>
