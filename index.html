<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>BlackRoad Dashboard</title>

<link rel="manifest" href="manifest.json">

<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">

<!-- Fallback for browsers/robots without JS: redirect after 6s (after the intro would have finished) -->
<meta http-equiv="refresh" content="6; url=blackroad-dashboard.html">
<style>
  :root{
    --bg: #E5B851;
    --bg-soft: #EDC670;
    --ink: #171308;
    --ink-soft: #2B2312;
    --line: rgba(23,19,8,0.35);
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html, body{
    width:100%;
    height:100%;
    background: var(--bg);
    overflow:hidden;
  }

  body{
    display:flex;
    align-items:center;
    justify-content:center;
    height: 100dvh;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  .splash{
    position:fixed;
    inset:0;
    background: radial-gradient(ellipse at 50% 46%, var(--bg-soft) 0%, var(--bg) 70%);
    display:flex;
    align-items:center;
    justify-content:center;
    animation: cineFade 0.85s ease-in forwards;
    animation-delay: 4.25s;
  }

  @keyframes cineFade{
    0%{ opacity:1; transform: scale(1); }
    100%{ opacity:0; visibility:hidden; transform: scale(1.03); }
  }

  /* fine grain for a non-flat surface, tuned down for a light background */
  .grain{
    position:absolute;
    inset:0;
    opacity:0.035;
    mix-blend-mode: multiply;
    pointer-events:none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }

  .vignette{
    position:absolute;
    inset:0;
    background: radial-gradient(ellipse at 50% 50%, transparent 50%, rgba(23,19,8,0.18) 100%);
    pointer-events:none;
  }

  /* soft warm bloom behind the mark as the reveal completes */
  .glow{
    position:absolute;
    width: 58vmin;
    height: 58vmin;
    border-radius:50%;
    background: radial-gradient(circle, rgba(255,255,255,0.55) 0%, transparent 72%);
    opacity:0;
    filter: blur(14px);
    animation: bloom 1.6s ease-out forwards;
    animation-delay: 1.5s;
  }

  @keyframes bloom{
    to{ opacity:1; }
  }

  .stage{
    position:relative;
    width: min(78vw, 420px);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    z-index:2;
  }

  .mark-svg{
    width:100%;
    height:auto;
    overflow: visible;
    filter: drop-shadow(0 0 0 rgba(23,19,8,0));
    animation: settleGlow 1s ease forwards;
    animation-delay: 1.55s;
  }

  @keyframes settleGlow{
    0%{ filter: drop-shadow(0 0 0 rgba(23,19,8,0)); }
    45%{ filter: drop-shadow(0 0 18px rgba(23,19,8,0.28)); }
    100%{ filter: drop-shadow(0 2px 6px rgba(23,19,8,0.22)); }
  }

  /* the light-edge that leads the reveal wipe */
  .lead-edge{
    animation: leadMove 1.45s cubic-bezier(.4,0,.2,1) forwards;
    animation-delay: 0.35s;
    opacity:0;
  }

  @keyframes leadMove{
    0%{ transform: translateX(-10px); opacity:0; }
    8%{ opacity:1; }
    92%{ opacity:1; }
    100%{ transform: translateX(410px); opacity:0; }
  }

  /* the reveal mask itself — starts fully covering the letters, then slides away to the right, revealing left→right */
  .wipe-rect{
    transform: translateX(0);
    animation: wipeOpen 1.45s cubic-bezier(.4,0,.2,1) forwards;
    animation-delay: 0.35s;
  }

  @keyframes wipeOpen{
    from{ transform: translateX(0); }
    to{ transform: translateX(430px); }
  }

  /* divider line beneath the mark */
  .divider{
    width: 0%;
    height: 1px;
    background: linear-gradient(to right, transparent, var(--ink) 50%, transparent);
    margin: 22px 0 16px;
    animation: drawLine 0.8s ease forwards;
    animation-delay: 2.0s;
  }

  @keyframes drawLine{
    to{ width: 62%; }
  }

  .tagline{
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: clamp(11px, 2.4vw, 14px);
    font-weight:600;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--ink);
    opacity:0;
    animation: taglineIn 1.1s ease forwards;
    animation-delay: 2.25s;
  }

  @keyframes taglineIn{
    0%{ opacity:0; letter-spacing: 0.55em; }
    100%{ opacity:0.82; letter-spacing: 0.5em; }
  }

  @media (min-width: 900px){
    .stage{ width: 380px; }
  }

  .credit{
    position:absolute;
    bottom: max(28px, env(safe-area-inset-bottom));
    left:50%;
    transform: translateX(-50%);
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: clamp(10px, 2.2vw, 12px);
    font-weight:500;
    letter-spacing: 0.08em;
    color: var(--ink);
    opacity:0;
    animation: creditIn 0.7s ease forwards;
    animation-delay: 3.1s;
    z-index:2;
  }

  .credit b{
    font-weight:700;
  }

  @keyframes creditIn{
    to{ opacity:0.55; }
  }

  @media (prefers-reduced-motion: reduce){
    .glow{ animation:none; opacity:1; }
    .mark-svg{ animation:none; filter: drop-shadow(0 2px 6px rgba(23,19,8,0.22)); }
    .lead-edge{ display:none; }
    .wipe-rect{ animation:none; transform: translateX(430px); }
    .divider{ animation:none; width:62%; }
    .tagline{ animation:none; opacity:0.82; letter-spacing:0.5em; }
    .credit{ animation:none; opacity:0.55; }
    .splash{ animation: cineFade 0.4s ease-in forwards; animation-delay: 4.25s; }
  }
</style>
</head>
<body>

  <div class="splash" id="splash">
    <div class="grain"></div>
    <div class="vignette"></div>
    <div class="glow"></div>

    <div class="stage">
      <svg class="mark-svg" id="markSvg" viewBox="0 0 400 180" preserveAspectRatio="xMidYMid meet">
        <defs>
          <linearGradient id="brushedGold" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#2B2312"/>
            <stop offset="55%" stop-color="var(--ink)"/>
            <stop offset="100%" stop-color="#0A0804"/>
          </linearGradient>

          <linearGradient id="edgeGlow" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#FFF6E0" stop-opacity="0"/>
            <stop offset="100%" stop-color="#FFF6E0" stop-opacity="0.95"/>
          </linearGradient>

          <clipPath id="letterClip">
            <text x="200" y="128" text-anchor="middle"
                  font-family="Helvetica Neue, Arial, sans-serif"
                  font-weight="800" font-size="150" letter-spacing="-4">BR</text>
          </clipPath>
        </defs>

        <g clip-path="url(#letterClip)">
          <!-- ink letterform, fully present underneath the wipe -->
          <rect x="0" y="-40" width="400" height="260" fill="url(#brushedGold)"/>

          <!-- gold-colored mask that wipes away left→right to reveal the ink -->
          <rect class="wipe-rect" x="0" y="-40" width="400" height="260" fill="var(--bg)"/>

          <!-- bright leading edge riding just ahead of the reveal -->
          <rect class="lead-edge" x="-6" y="-40" width="16" height="260" fill="url(#edgeGlow)"/>
        </g>
      </svg>

      <div class="divider"></div>
      <div class="tagline">BlackRoad</div>
    </div>

    <div class="credit">Developed by <b>Microintel</b></div>
  </div>

<script>
  const SPLASH_DURATION = 5000;
  const REDIRECT_URL = "blackroad-dashboard.html";

  window.addEventListener('DOMContentLoaded', () => {
    setTimeout(() => {
      document.dispatchEvent(new CustomEvent('splash:complete'));

      const splash = document.getElementById('splash');
      splash.addEventListener('animationend', (e) => {
        if (e.animationName === 'cineFade') {
          splash.remove();
          document.body.style.background = '#E5B851';
        }
      });
    }, SPLASH_DURATION - 750);

    // Hand off to the dashboard once the intro has fully played.
    setTimeout(() => {
      window.location.replace(REDIRECT_URL);
    }, SPLASH_DURATION);
  });
</script>

</body>
</html>
