<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>BlackRoad Dashboard</title>

<link rel="manifest" href="manifest.json">

<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">

<!-- Fallback for browsers/robots without JS: redirect after 8s (after the intro would have finished) -->
<style>
  :root{
    --bg: #E5B851;
    --bg-soft: #EDC670;
    --ink: #171308;
    --ink-soft: #2B2312;
    --line: rgba(23,19,8,0.35);
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html, body{
    width:100%;
    height:100%;
    background: var(--bg);
    overflow:hidden;
  }

  body{
    display:flex;
    align-items:center;
    justify-content:center;
    height: 100dvh;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  .splash{
    position:fixed;
    inset:0;
    background: var(--bg);
    display:flex;
    align-items:center;
    justify-content:center;
    animation: cineFade 0.36s ease-in forwards;
    animation-delay: 2.64s;
  }

  @keyframes cineFade{
    0%{ opacity:1; transform: scale(1); }
    100%{ opacity:0; visibility:hidden; transform: scale(1.03); }
  }

  /* fine grain for a non-flat surface, tuned down for a light background */
  .grain{
    position:absolute;
    inset:0;
    opacity:0.035;
    mix-blend-mode: multiply;
    pointer-events:none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }

  .vignette{
    position:absolute;
    inset:0;
    background: radial-gradient(ellipse at 50% 50%, transparent 50%, rgba(23,19,8,0.18) 100%);
    pointer-events:none;
  }

  /* soft warm bloom behind the mark as the reveal completes */
  .glow{
    position:absolute;
    width: 58vmin;
    height: 58vmin;
    border-radius:50%;
    background: radial-gradient(circle, rgba(255,255,255,0.55) 0%, transparent 72%);
    opacity:0;
    filter: blur(14px);
    animation: bloom 0.72s ease-out forwards;
    animation-delay: 0.93s;
  }

  @keyframes bloom{
    to{ opacity:1; }
  }

  /* ---------------- icon orbit (bank / cash / savings / loans / fund / stocks) ---------------- */

  .icon-orbit{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:1;
    pointer-events:none;
  }

  .icon-orbit-inner{
    position:relative;
    width:1px;
    height:1px;
    transform: scale(1);
  }

  /* keep the orbit radius proportionate on small screens */
  @media (max-width: 420px){
    .icon-orbit-inner{ transform: scale(0.62); }
  }
  @media (min-width: 421px) and (max-width: 640px){
    .icon-orbit-inner{ transform: scale(0.78); }
  }
  @media (min-width: 641px) and (max-width: 900px){
    .icon-orbit-inner{ transform: scale(0.92); }
  }
  @media (min-width: 1400px){
    .icon-orbit-inner{ transform: scale(1.15); }
  }

  .icon-chip{
    position:absolute;
    left:50%;
    top:50%;
    width:64px;
    height:64px;
    margin:-32px 0 0 -32px;
    border-radius:18px;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow: 0 8px 18px rgba(23,19,8,0.22), inset 0 1px 0 rgba(255,255,255,0.35);
    opacity:0;
    animation: iconIn 0.33s cubic-bezier(.34,1.56,.64,1) forwards, iconOut 0.3s cubic-bezier(.4,0,1,1) forwards;
    animation-delay: var(--in-delay), 0.75s;
  }

  .icon-chip svg{
    width:32px;
    height:32px;
  }

  @keyframes iconIn{
    0%{
      transform: translate(var(--fx), var(--fy)) scale(0.35) rotate(-18deg);
      opacity:0;
    }
    70%{
      transform: translate(calc(var(--tx) * 1.04), calc(var(--ty) * 1.04)) scale(1.05) rotate(2deg);
      opacity:1;
    }
    100%{
      transform: translate(var(--tx), var(--ty)) scale(1) rotate(0deg);
      opacity:1;
    }
  }

  @keyframes iconOut{
    0%{
      transform: translate(var(--tx), var(--ty)) scale(1);
      opacity:1;
    }
    100%{
      transform: translate(0px, 0px) scale(0.15);
      opacity:0;
    }
  }

  /* ---------------- BR mark stage ---------------- */

  .stage{
    position:relative;
    width: min(78vw, 420px);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    z-index:2;
    opacity:0;
    transform: scale(0.82);
    animation: stageIn 0.33s cubic-bezier(.2,.8,.2,1) forwards;
    animation-delay: 0.96s;
  }

  @keyframes stageIn{
    to{ opacity:1; transform: scale(1); }
  }

  .mark-svg{
    width:100%;
    height:auto;
    overflow: visible;
    filter: drop-shadow(0 0 0 rgba(23,19,8,0));
    animation: settleGlow 0.54s ease forwards;
    animation-delay: 1.32s;
  }

  @keyframes settleGlow{
    0%{ filter: drop-shadow(0 0 0 rgba(23,19,8,0)); }
    45%{ filter: drop-shadow(0 0 18px rgba(23,19,8,0.28)); }
    100%{ filter: drop-shadow(0 2px 6px rgba(23,19,8,0.22)); }
  }

  /* the light-edge that leads the reveal wipe */
  .lead-edge{
    animation: leadMove 0.6s cubic-bezier(.4,0,.2,1) forwards;
    animation-delay: 1.29s;
    opacity:0;
  }

  @keyframes leadMove{
    0%{ transform: translateX(-10px); opacity:0; }
    8%{ opacity:1; }
    92%{ opacity:1; }
    100%{ transform: translateX(410px); opacity:0; }
  }

  /* the reveal mask itself — starts fully covering the letters, then slides away to the right, revealing left→right */
  .wipe-rect{
    transform: translateX(0);
    animation: wipeOpen 0.6s cubic-bezier(.4,0,.2,1) forwards;
    animation-delay: 1.29s;
  }

  @keyframes wipeOpen{
    from{ transform: translateX(0); }
    to{ transform: translateX(430px); }
  }

  /* divider line beneath the mark */
  .divider{
    width: 0%;
    height: 1px;
    background: linear-gradient(to right, transparent, var(--ink) 50%, transparent);
    margin: 22px 0 16px;
    animation: drawLine 0.36s ease forwards;
    animation-delay: 1.89s;
  }

  @keyframes drawLine{
    to{ width: 62%; }
  }

  .tagline{
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: clamp(16px, 4vw, 22px);
    font-weight:700;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--ink);
    opacity:0;
    animation: taglineIn 0.48s ease forwards;
    animation-delay: 2.01s;
  }

  @keyframes taglineIn{
    0%{ opacity:0; letter-spacing: 0.55em; }
    100%{ opacity:0.82; letter-spacing: 0.5em; }
  }

  @media (min-width: 900px){
    .stage{ width: 380px; }
  }

  .credit{
    position:absolute;
    bottom: max(28px, env(safe-area-inset-bottom));
    left:50%;
    transform: translateX(-50%);
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: clamp(13px, 3vw, 16px);
    font-weight:600;
    letter-spacing: 0.08em;
    color: var(--ink);
    opacity:0;
    animation: creditIn 0.36s ease forwards;
    animation-delay: 2.22s;
    z-index:2;
  }

  .credit b{
    font-weight:700;
  }

  @keyframes creditIn{
    to{ opacity:0.55; }
  }

  @media (prefers-reduced-motion: reduce){
    .icon-orbit{ display:none; }
    .glow{ animation:none; opacity:1; }
    .stage{ animation:none; opacity:1; transform:scale(1); }
    .mark-svg{ animation:none; filter: drop-shadow(0 2px 6px rgba(23,19,8,0.22)); }
    .lead-edge{ display:none; }
    .wipe-rect{ animation:none; transform: translateX(430px); }
    .divider{ animation:none; width:62%; }
    .tagline{ animation:none; opacity:0.82; letter-spacing:0.5em; }
    .credit{ animation:none; opacity:0.55; }
    .splash{ animation: cineFade 0.24s ease-in forwards; animation-delay: 2.55s; }
  }
</style>
</head>
<body>

  <div class="splash" id="splash">
    <div class="grain"></div>
    <div class="vignette"></div>
    <div class="glow"></div>

    <!-- Icon orbit: bank, cash, savings, loans, mutual fund, stocks fly in, form a ring, then converge to the center -->
    <div class="icon-orbit" id="iconOrbit">
      <div class="icon-orbit-inner">

        <!-- Bank -->
        <div class="icon-chip" style="background:#4F8EF7; --tx:0px; --ty:-104px; --fx:0px; --fy:-360px; --in-delay:0s;">
          <svg viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2.5L2.5 8h19L12 2.5z" fill="#ffffff" stroke="none"/>
            <line x1="4.5" y1="9.5" x2="4.5" y2="18.5"/>
            <line x1="9" y1="9.5" x2="9" y2="18.5"/>
            <line x1="15" y1="9.5" x2="15" y2="18.5"/>
            <line x1="19.5" y1="9.5" x2="19.5" y2="18.5"/>
            <line x1="2.5" y1="20.5" x2="21.5" y2="20.5"/>
          </svg>
        </div>

        <!-- Cash -->
        <div class="icon-chip" style="background:#2ECC71; --tx:90px; --ty:-52px; --fx:310px; --fy:-180px; --in-delay:0.03s;">
          <svg viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2.5" y="6.5" width="19" height="11" rx="2"/>
            <circle cx="12" cy="12" r="3"/>
            <line x1="5.5" y1="9" x2="5.5" y2="9"/>
            <line x1="18.5" y1="15" x2="18.5" y2="15"/>
          </svg>
        </div>

        <!-- Stocks -->
        <div class="icon-chip" style="background:#14B8B8; --tx:90px; --ty:52px; --fx:310px; --fy:180px; --in-delay:0.06s;">
          <svg viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="14" width="3.2" height="7"/>
            <rect x="10.4" y="10" width="3.2" height="11"/>
            <rect x="17.8" y="5.5" width="3.2" height="15.5"/>
            <path d="M13 6.5h6.5v6.5" stroke-dasharray="0" opacity="0"/>
          </svg>
        </div>

        <!-- Loans -->
        <div class="icon-chip" style="background:#FF8A3D; --tx:0px; --ty:104px; --fx:0px; --fy:360px; --in-delay:0.09s;">
          <svg viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="7.5" cy="7.5" r="2.2"/>
            <circle cx="16.5" cy="16.5" r="2.2"/>
            <line x1="6" y1="18" x2="18" y2="6"/>
          </svg>
        </div>

        <!-- Mutual fund -->
        <div class="icon-chip" style="background:#8B5CF6; --tx:-90px; --ty:52px; --fx:-310px; --fy:180px; --in-delay:0.12s;">
          <svg viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"/>
            <line x1="12" y1="12" x2="12" y2="3"/>
            <line x1="12" y1="12" x2="19.2" y2="16.5"/>
            <line x1="12" y1="12" x2="4.8" y2="16.5"/>
          </svg>
        </div>

        <!-- Savings -->
        <div class="icon-chip" style="background:#FF3EA5; --tx:-90px; --ty:-52px; --fx:-310px; --fy:-180px; --in-delay:0.15s;">
          <svg viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 13c0-3.6 3.2-6.5 8-6.5 3 0 5 1 6.3 2.3.9-.2 1.7.1 2.2.8-.5.9-1.3 1.2-2 1.2.3.6.5 1.3.5 2.2 0 3.6-3.2 6-7 6-1 0-1.9-.1-2.7-.4L7.5 20H5l1.2-2.6C4.7 16.2 4 14.8 4 13z" fill="#ffffff" stroke="none"/>
            <circle cx="15.5" cy="11.3" r="0.6" fill="#FF3EA5" stroke="none"/>
            <line x1="9" y1="9.2" x2="7" y2="7.6"/>
          </svg>
        </div>

      </div>
    </div>

    <div class="stage" id="stage">
      <svg class="mark-svg" id="markSvg" viewBox="0 0 400 180" preserveAspectRatio="xMidYMid meet">
        <defs>
          <linearGradient id="brushedGold" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#2B2312"/>
            <stop offset="55%" stop-color="var(--ink)"/>
            <stop offset="100%" stop-color="#0A0804"/>
          </linearGradient>

          <linearGradient id="edgeGlow" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#FFF6E0" stop-opacity="0"/>
            <stop offset="100%" stop-color="#FFF6E0" stop-opacity="0.95"/>
          </linearGradient>

          <clipPath id="letterClip">
            <text x="200" y="128" text-anchor="middle"
                  font-family="Helvetica Neue, Arial, sans-serif"
                  font-weight="800" font-size="150" letter-spacing="-4">BR</text>
          </clipPath>
        </defs>

        <g clip-path="url(#letterClip)">
          <!-- ink letterform, fully present underneath the wipe -->
          <rect x="0" y="-40" width="400" height="260" fill="url(#brushedGold)"/>

          <!-- gold-colored mask that wipes away left→right to reveal the ink -->
          <rect class="wipe-rect" x="0" y="-40" width="400" height="260" fill="var(--bg)"/>

          <!-- bright leading edge riding just ahead of the reveal -->
          <rect class="lead-edge" x="-6" y="-40" width="16" height="260" fill="url(#edgeGlow)"/>
        </g>
      </svg>

      <div class="divider"></div>
      <div class="tagline">BlackRoad</div>
    </div>

    <div class="credit">Developed by <b>Microintel</b></div>
  </div>

<script>
  const REDIRECT_URL = "blackroad-dashboard.html";

  // Register Service Worker
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("/sw.js")
        .then(() => {
          console.log("BlackRoad Service Worker registered");
        })
        .catch(error => {
          console.error("Service Worker registration failed:", error);
        });
    });
  }

  window.addEventListener("DOMContentLoaded", () => {
    const splash = document.getElementById("splash");

    // Wait until the splash fade animation has completely finished
    splash.addEventListener("animationend", (event) => {
      if (event.animationName === "cineFade") {
        splash.remove();

        // Redirect only AFTER splash animation finishes
        window.location.replace(REDIRECT_URL);
      }
    });
  });
</script>

</body>
</html>
