<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signing Out — BlackRoad</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon512_rounded.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<style>
:root{ --gold:#E8B84B; --radius-lg:26px; --ease:cubic-bezier(.4,0,.2,1); }
html[data-theme="dark"]{
  --bg:#1B1E24; --surface:#1B1E24; --border:rgba(255,255,255,.06);
  --text:#F2F0EA; --text-faint:#5C6270; --accent:var(--gold);
  --nl:rgba(255,255,255,.05); --nd:rgba(0,0,0,.62);
  --shadow: 8px 8px 16px var(--nd), -8px -8px 16px var(--nl);
  --shadow-sm: 4px 4px 9px var(--nd), -4px -4px 9px var(--nl);
}
html[data-theme="light"]{
  --bg:#EAE7DE; --surface:#EAE7DE; --border:rgba(30,25,10,.08);
  --text:#171A1F; --text-faint:#84808f; --accent:#B8862A;
  --nl:rgba(255,255,255,.9); --nd:rgba(163,150,115,.4);
  --shadow: 8px 8px 16px var(--nd), -8px -8px 16px var(--nl);
  --shadow-sm: 4px 4px 9px var(--nd), -4px -4px 9px var(--nl);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:'Inter',sans-serif; background:var(--bg); color:var(--text);
  min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; text-align:center;
}
h1,.display{font-family:'Outfit',sans-serif;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
.lane{height:3px;width:100%;background-image:repeating-linear-gradient(90deg, rgba(232,184,75,.55) 0 26px, transparent 26px 46px);opacity:.9;}
.card{
  width:100%; max-width:380px; background:var(--surface); border:1px solid var(--border);
  border-radius:var(--radius-lg); box-shadow:var(--shadow); padding:38px 30px 30px;
  animation:cardIn .5s var(--ease);
}
@keyframes cardIn{ from{opacity:0; transform:translateY(12px);} to{opacity:1; transform:none;} }
.mark{
  width:56px;height:56px;border-radius:16px;background:var(--accent);color:#0B0D10;
  display:flex;align-items:center;justify-content:center;font-size:24px;margin:0 auto 18px;
  box-shadow:var(--shadow-sm);
}
h1{font-size:19px;margin-bottom:8px;}
p{font-size:13.5px;color:var(--text-faint);margin-bottom:22px;}
.btn-primary{
  display:inline-flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;padding:10px 20px;
  border-radius:999px;background:var(--accent);color:#0B0D10;box-shadow:var(--shadow-sm);
}
</style>
</head>
<body>
<div class="card">
  <div class="lane" style="margin-bottom:22px;"></div>
  <div class="mark"><i class="bi bi-box-arrow-right"></i></div>
  <h1>You've been signed out</h1>
  <p>Your session has ended. Redirecting you to sign in…</p>
  <a href="login.html" class="btn-primary"><i class="bi bi-box-arrow-in-right"></i> Back to Sign In</a>
</div>

<script src="auth.js"></script>
<script>
(async ()=>{
  try{
    const saved = window.storage ? (await window.storage.get('theme', false)) : {value: localStorage.getItem('br_theme')};
    if(saved && saved.value) document.documentElement.setAttribute('data-theme', saved.value);
  }catch(e){}
  await BRAuth.logout();
  setTimeout(()=> location.replace('login.html'), 1600);
})();
</script>
</body>
</html>
